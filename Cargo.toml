[workspace]
resolver = "2"
members = [
  "crates/playlist-generator-core",
  "crates/playlist-generator",
  "crates/playlist-generator-tui",
  "crates/playlist-generator-web",
]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[workspace.dependencies]
atomic-write-file = "0.3.0"
clap = { version = "=4.6.6", features = ["derive"] }
command-group = "=5.0.1"
# The terminal frontend's layer. Terminal I/O is read, write, and ioctl on file
# descriptors, so these dlopen nothing and the Linux packages link fully
# static -- one binary for every distribution.
# crossterm keeps its default features: `events` is the keyboard input the
# whole frontend is driven by.
crossterm = "=0.29.0"
num_cpus = "1.17.0"
# 0.29 depends on `paste`, which is unmaintained per RUSTSEC-2024-0436; 0.30
# dropped it, so staying current here avoids carrying an advisory exemption.
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
signal-hook = "0.3.18"
thiserror = "2.0.18"
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"
